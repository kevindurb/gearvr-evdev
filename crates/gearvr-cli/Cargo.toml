[package]
name = "gearvr-cli"
description = "Command-line driver for the Samsung Gear VR Controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gearvr-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gearvr-ble = { path = "../gearvr-ble" }
gearvr-core = { path = "../gearvr-core" }
gearvr-fusion = { path = "../gearvr-fusion" }
gearvr-output = { path = "../gearvr-output" }
gearvr-protocol = { path = "../gearvr-protocol", features = ["testing"] }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["bluez"]
bluez = ["gearvr-ble/bluez"]
dualsense = ["gearvr-output/dualsense"]
