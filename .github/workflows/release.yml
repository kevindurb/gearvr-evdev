name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify tag, format, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check tag against workspace version
        run: ./scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  tarball:
    name: Build release tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git pkg-config libdbus-1-dev \
            build-essential binutils

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@1.85.0

      - name: Build and verify tarball
        run: ./scripts/build-tarball.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  rpm:
    name: Build release RPM
    needs: [verify, tarball]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y git rpm-build systemd-rpm-macros tar gzip

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist

      - name: Build RPM from the release tarball
        run: ./scripts/build-rpm.sh

      - name: Verify RPM contents
        run: |
          set -euo pipefail
          rpm_file=$(ls dist/*.rpm)
          rpm -qpR "$rpm_file" | grep -qx 'dbus-libs'
          rpm -qpR "$rpm_file" | grep -qx 'systemd'
          rpm -qpR "$rpm_file" | grep -qx 'udev'
          rpm -qpR "$rpm_file" | grep -qx 'bluez'
          rpm -qpl "$rpm_file" | grep -qx '/usr/bin/gearvr-cli'
          rpm -qpl "$rpm_file" | grep -qx '/usr/lib/systemd/user/gearvr.service'
          rpm -qpl "$rpm_file" | grep -qx '/usr/lib/udev/rules.d/60-gearvr-permissions.rules'
          rpm -qpl "$rpm_file" | grep -qx '/usr/lib/udev/rules.d/70-gearvr-evdev.rules'

      - uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: dist/*.rpm
          if-no-files-found: error

  publish:
    name: Attach assets to the GitHub release
    if: github.event_name == 'release'
    needs: [verify, tarball, rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-rpm
          path: dist

      - name: Write checksums
        run: (cd dist && sha256sum -- *.tar.gz *.rpm > SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.tar.gz dist/*.rpm dist/SHA256SUMS \
            --clobber
