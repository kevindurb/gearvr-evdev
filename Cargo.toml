[workspace]
members = [
    "crates/gearvr-protocol",
    "crates/gearvr-core",
    "crates/gearvr-fusion",
    "crates/gearvr-ble",
    "crates/gearvr-output",
    "crates/gearvr-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kevindurb/gearvr-evdev"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
glam = "0.34"
libc = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
